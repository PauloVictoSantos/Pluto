# Blueprint do Render: um servico web com a API e o site (ver DEPLOY-RENDER.md).
services:
  - type: web
    name: pluto
    runtime: node
    # free dorme apos 15 min sem uso (a sincronizacao automatica do Pluggy para junto).
    plan: starter
    region: virginia
    # Dependencias de desenvolvimento sao necessarias no build (tsup, typescript), por isso
    # NODE_ENV=development so no install. MONGOMS_DISABLE_POSTINSTALL evita baixar o mongod de testes.
    # O next build roda direto (a saida do pnpm -r esconde os erros) e sempre com NODE_ENV=production:
    # com outro valor o React fica em modo dev e o prerender de /_global-error quebra.
    buildCommand: corepack enable && MONGOMS_DISABLE_POSTINSTALL=1 NODE_ENV=development pnpm install --frozen-lockfile && pnpm --filter @pluto/api build && cd apps/web && NODE_ENV=production npx next build
    startCommand: node scripts/start-render.mjs
    # Passa pelo site e chega na API: prova que os dois estao de pe.
    healthCheckPath: /v1/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.13.1
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: SYNC_INTERVAL_HOURS
        value: "6"
      # Endereco publico do site, ex.: https://pluto.onrender.com (sem barra no fim).
      - key: ALLOWED_ORIGINS
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: JWT_PUBLIC_KEY
        sync: false
      # Tem de ser a MESMA do ambiente atual: ela decifra os Item IDs ja salvos no Atlas.
      - key: FIELD_ENCRYPTION_KEY
        sync: false
      - key: BACKUP_PASSPHRASE
        sync: false
      - key: PLUGGY_CLIENT_ID
        sync: false
      - key: PLUGGY_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Chave restrita do Stripe (PaymentIntents e PaymentMethods em Write). Teste: rk_test_...
      - key: STRIPE_SECRET_KEY
        sync: false
      # Segredo do webhook (whsec_...), criado ao cadastrar https://<servico>.onrender.com/v1/webhooks/stripe
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Resend: e-mail dos boletos e aviso de cancelamento ao pagador.
      - key: RESEND_API_KEY
        sync: false
      # Remetente de um dominio verificado no Resend, ex.: Pluto <cobranca@seudominio.com.br>
      - key: EMAIL_FROM
        sync: false
      # Web Push dos alertas: o mesmo par VAPID do apps/api/.env (node apps/api/scripts/gen-secrets.mjs gera um novo).
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      # Contato do responsavel para os servicos de push, ex.: mailto:voce@seudominio.com.br
      - key: VAPID_SUBJECT
        sync: false
      # Sentry (opcional): erros inesperados da API. Ver RECUPERACAO.md.
      - key: SENTRY_DSN
        sync: false
      - key: LLM_MODEL
        value: gemini-3.8-flash
